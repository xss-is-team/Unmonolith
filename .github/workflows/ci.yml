name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser:
    name: Parser (JDT) · mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -q test
        working-directory: apps/parser

  api:
    name: API (Rust) · cargo test with the real parser JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/api }
      - run: mvn -B -q package -DskipTests
        working-directory: apps/parser
      - run: cargo fmt --check && cargo test
        working-directory: apps/api
        env:
          BLUEPRINTS_REAL_JAVA: ${{ env.JAVA_HOME }}/bin/java

  web-e2e:
    name: Web · build, lint and Playwright against the real API, parser and Docker runner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/api }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: mvn -B -q package -DskipTests
        working-directory: apps/parser
      - run: docker build -t java-blueprints-runner:java21 apps/runner
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: apps/web
      - run: pnpm build && pnpm exec eslint src
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm exec playwright test
        working-directory: apps/web
        env:
          BLUEPRINTS_REAL_JAVA: ${{ env.JAVA_HOME }}/bin/java
          BLUEPRINTS_REAL_RUNNER_IMAGE: java-blueprints-runner:java21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
