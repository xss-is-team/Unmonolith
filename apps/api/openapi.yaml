openapi: 3.0.3
info:
  title: Java Blueprints MVP API
  version: 0.7.0
  description: |
    Guest sessions, revisioned single-file and ZIP (multi-file) Java projects, JDT analysis, compilation-unit project graph and nested per-method CFG access,
    revision history, SSE analysis lifecycle, restricted replace_condition transformations,
    and isolated Java 21 behavioral verification.
servers:
  - url: /api/v1
tags:
  - name: Sessions
  - name: Projects
  - name: Analysis
  - name: Transformations
  - name: Optimization
  - name: Verification
  - name: Planned M2+
  - name: System
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [System]
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
  /sessions/guest:
    post:
      operationId: createGuestSession
      tags: [Sessions]
      description: Creates an anonymous session and sets an HttpOnly cookie.
      responses:
        '201':
          description: Guest session created
          headers:
            Set-Cookie:
              schema: {type: string}
              description: Opaque session cookie; HttpOnly, SameSite=Lax, Secure under HTTPS
          content:
            application/json:
              schema:
                type: object
                required: [kind]
                properties:
                  kind: {type: string, enum: [guest]}
  /projects:
    post:
      operationId: uploadProject
      tags: [Projects]
      security: [{guestSession: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    Either one .java UTF-8 source file (single-file project) or a .zip archive
                    (archive project; routed by the .zip filename and validated as a ZIP).
                    Archive entries must be .java files or inert text/build files; anything else,
                    unsafe paths, symlinks, duplicate (case-folded) paths and oversize or
                    bomb-like entries reject the whole import. Build scripts are stored, never run.
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422':
          description: |
            Archive rejected. Error codes: invalid_archive, unsafe_archive_path, archive_symlink,
            duplicate_archive_path, unsupported_archive_entry, no_java_sources, archive_bomb,
            invalid_encoding.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /projects/{project_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProject
      tags: [Projects]
      security: [{guestSession: []}]
      responses:
        '200':
          description: Project metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/source:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProjectSource
      tags: [Projects]
      security: [{guestSession: []}]
      responses:
        '200':
          description: Current Java source
          headers:
            X-Source-Revision:
              schema: {type: integer, minimum: 1}
          content:
            text/plain:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateProjectSource
      tags: [Projects]
      security: [{guestSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSourceRequest'}
      responses:
        '200':
          description: Updated revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/files:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listProjectFiles
      tags: [Projects]
      security: [{guestSession: []}]
      summary: Revisioned file manifest (works for single-file and archive projects)
      parameters:
        - {name: revision, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Manifest of the requested (default current) revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Manifest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/files/{path}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: path, in: path, required: true, schema: {type: string}, description: Archive-relative path; slashes are literal path separators, e.g. src/main/java/app/Main.java}
    get:
      operationId: getProjectFile
      tags: [Projects]
      security: [{guestSession: []}]
      parameters:
        - {name: revision, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: File contents at the revision
          headers:
            X-Source-Revision:
              schema: {type: integer, minimum: 1}
          content:
            text/plain:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateProjectFile
      tags: [Projects]
      security: [{guestSession: []}]
      summary: Replace one existing file, creating a new project revision (full snapshot)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateFileRequest'}
      responses:
        '200':
          description: New project revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
  /projects/{project_id}/analyze:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: analyzeProject
      tags: [Analysis]
      description: |
        M1 synchronous analysis adapter with timeout. Invokes Java worker if configured.
        If worker is missing, returns 503; NEVER fabricate successful analysis.
        Archive projects are analysed as a whole (all .java files bound in one JDT environment,
        cross-file calls resolved); methods then carry `source_range.file` and package-qualified ids.
      security: [{guestSession: []}]
      parameters:
        - name: source_level
          in: query
          required: false
          schema: {type: string, enum: ['8', '11', '17', '21'], default: '21'}
          description: Java language level. Archive projects only. 1.2-1.7 are rejected because the bundled Eclipse JDT cannot parse below Java 8.
      responses:
        '200':
          description: Validated result from a real Java worker
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /projects/{project_id}/analyze/stream:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: analyzeProjectStream
      tags: [Analysis]
      description: Streams the lifecycle of the same real analyzer invocation used by the synchronous endpoint.
      security: [{guestSession: []}]
      parameters:
        - {name: source_level, in: query, required: false, schema: {type: string, enum: ['8', '11', '17', '21'], default: '21'}}
      responses:
        '200':
          description: Server-sent `started`, `progress`, and `completed` or `failed` events.
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/revisions:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listProjectRevisions
      tags: [Projects]
      security: [{guestSession: []}]
      responses:
        '200':
          description: Published source revisions, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RevisionSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/revisions/{revision}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - name: revision
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getProjectRevision
      tags: [Projects]
      security: [{guestSession: []}]
      responses:
        '200':
          description: Source text and analysis availability for one owned revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevisionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/methods:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listMethods
      tags: [Analysis]
      description: Lists methods and constructors with CFGs in the current revision's analysis artifact.
      security: [{guestSession: []}]
      responses:
        '200':
          description: Revision-local CFG method selectors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MethodsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/graph:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProjectGraph
      tags: [Analysis]
      description: Returns the unchanged parser project_graph from the current revision's analysis artifact. Scope is the uploaded compilation unit. `graph` is JSON null when the parser could not build the graph (see the `project_graph_failed` diagnostic).
      security: [{guestSession: []}]
      responses:
        '200':
          description: Revision-bound parser project graph
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectGraphResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500':
          description: Stored project graph is missing or has an unexpected shape
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /projects/{project_id}/complexity:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProjectComplexity
      tags: [Analysis]
      security: [{guestSession: []}]
      summary: Machine-readable complexity estimates of every method with a body (no findings, no transformations)
      responses:
        '200':
          description: One entry per method; `time_complexity` is `unknown` when no bound can be justified. Space complexity is not estimated (always null).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComplexityReport'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/findings:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProjectFindings
      tags: [Analysis]
      security: [{guestSession: []}]
      summary: Code smells and optimization findings, separate from complexity estimates
      responses:
        '200':
          description: Findings with method id, file and evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FindingsReport'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/methods/{method_selector}/cfg:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - name: method_selector
        in: path
        required: true
        description: Opaque, URL-safe, revision-local selector returned by the methods endpoint.
        schema: {type: string, example: m1}
    get:
      operationId: getMethodCfg
      tags: [Analysis]
      description: Returns the selected CFG object exactly as emitted inside the current revision's nested AST.
      security: [{guestSession: []}]
      responses:
        '200':
          description: CFG for one method
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cfg'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/methods/{method_selector}/analysis:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - name: method_selector
        in: path
        required: true
        description: Opaque, URL-safe, revision-local selector returned by the methods endpoint.
        schema: {type: string, example: m1}
    get:
      operationId: getMethodAnalysis
      tags: [Analysis]
      description: |
        Returns the selected method's complexity, fragments and findings exactly as stored in the
        current revision's parser artifact. Source ranges are UTF-16 and node IDs refer to that
        method's CFG in the same revision.
      security: [{guestSession: []}]
      responses:
        '200':
          description: Revision-bound method analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MethodAnalysisResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/transform:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: transformProject
      tags: [Transformations]
      description: |
        Applies replace_condition through the Java AST worker, reparses the result, and commits it as a
        new revision only when parsing and semantic validation complete without errors.
      security: [{guestSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransformRequest'}
      responses:
        '200':
          description: New source revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransformResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /projects/{project_id}/verify:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: verifyBehavior
      tags: [Verification]
      description: |
        Compiles two existing revisions in isolated Java 21 containers, runs the same named stdin
        fixtures, and compares stdout bytes, stderr bytes, exit codes, timeout and overflow states.
        A passing result applies only to the supplied fixtures and is not proof of equivalence.
        Archive projects compile all `.java` files of each revision together (`javac --release <source_level>`)
        and run `main_class` (see the request fields).
      security: [{guestSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyRequest'}
      responses:
        '200':
          description: Persisted structured compilation and behavioral comparison report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersistedVerificationReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /projects/{project_id}/verify/{report_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - name: report_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getVerificationReport
      tags: [Verification]
      description: Returns one persisted verification report owned by the current guest session.
      security: [{guestSession: []}]
      responses:
        '200':
          description: Persisted verification report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersistedVerificationReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/optimizations:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listOptimizations
      tags: [Optimization]
      security: [{guestSession: []}]
      summary: Detect optimization candidates (rule nested_scan_to_hashmap) in the current revision
      description: |
        Every nested scan that looks like a keyed lookup becomes a proposal, applicable or not. Each lists its
        preconditions (`satisfied`/`violated`, with the reason), the assumptions the caller must acknowledge to apply it,
        the affected files and the estimated complexity impact. Detection never changes anything.
      parameters:
        - {name: source_level, in: query, required: false, schema: {type: string, enum: ['8', '11', '17', '21'], default: '21'}}
      responses:
        '200':
          description: Proposals of the current revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OptimizationList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /projects/{project_id}/optimizations/{proposal_id}/preview:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: proposal_id, in: path, required: true, schema: {type: string, pattern: '^opt_[0-9a-f]{16}$'}}
    post:
      operationId: previewOptimization
      tags: [Optimization]
      security: [{guestSession: []}]
      summary: Exact unified diff of the rewrite (ASTRewrite), re-parsed and validated; nothing is stored
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OptimizationPreviewRequest'}
      responses:
        '200':
          description: Diff, fingerprint and complexity before/after
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OptimizationPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /projects/{project_id}/optimizations/{proposal_id}/apply:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: proposal_id, in: path, required: true, schema: {type: string, pattern: '^opt_[0-9a-f]{16}$'}}
    post:
      operationId: applyOptimization
      tags: [Optimization]
      security: [{guestSession: []}]
      summary: Explicit user action - commit the previewed rewrite as a new, re-analysed revision
      description: |
        Requires the current `base_revision` (409 revision_conflict otherwise), the `preview_sha256` of the confirmed
        preview (409 preview_mismatch if the rewrite would differ) and the ids of every assumption of the proposal
        (422 assumptions_not_acknowledged). A not-applicable proposal is refused (422 optimization_not_applicable).
        Roll back with `POST /rollback`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OptimizationApplyRequest'}
      responses:
        '200':
          description: New revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OptimizationApplyResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /projects/{project_id}/cfg-edits/preview:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: previewCfgEdit
      tags: [Transformations]
      security: [{guestSession: []}]
      summary: Preview moving a statement (from a CFG drag) as a real Java diff, or the structured reasons it is unsafe
      description: |
        Moving nodes in the browser changes layout only. This route changes Java: `move_statement` places a statement
        before/after another statement of the same block, over every statement in between, and only if it is
        independent of all of them (data dependencies, abrupt completion, I/O and unknown calls, exception order,
        synchronization). Rejections are 422 `move_rejected` with `details.reasons[]` ({code, message, statements[]}).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CfgEditRequest'}
      responses:
        '200':
          description: Diff, independence evidence and old->new CFG node mapping
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CfgEditPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /projects/{project_id}/cfg-edits/apply:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: applyCfgEdit
      tags: [Transformations]
      security: [{guestSession: []}]
      summary: Commit a previewed CFG edit as a new revision; the CFG and source mappings are recomputed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CfgEditApplyRequest'}
      responses:
        '200':
          description: New revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CfgEditApplyResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /projects/{project_id}/rollback:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: rollbackProject
      tags: [Optimization]
      security: [{guestSession: []}]
      summary: Restore an earlier revision as a new revision (history is kept)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '200':
          description: New current revision whose files (and analysis) are those of `to_revision`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/revisions/{from}/diff/{to}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: from, in: path, required: true, schema: {type: integer, minimum: 1}}
      - {name: to, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: compareRevisions
      tags: [Projects]
      security: [{guestSession: []}]
      summary: Unified diff of every file that differs between two revisions
      responses:
        '200':
          description: Per-file unified diffs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevisionDiff'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/benchmark:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: runBenchmark
      tags: [Verification]
      security: [{guestSession: []}]
      summary: Reproducible runtime comparison of two revisions in the isolated runner
      description: |
        Compiles both revisions in separate containers (1 CPU, 512 MB, no network) and calls `main` in a benchmark
        JVM warmup+measured times per workload with a monotonic clock. The report keeps three results apart:
        `static_complexity` (Big O before/after), `functional` (identical stdout/outcome on the workloads) and
        `runtime` (samples, median, spread, significance test). A `speedup` is present only when at least 10
        measured iterations, a significant Mann-Whitney test, a bootstrap interval excluding 1 and separated
        interquartile ranges agree; differing behaviour is reported as `not_equivalent`, never as an optimization.
        Compile/setup/startup times are reported separately under `timings`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BenchmarkRequest'}
      responses:
        '200':
          description: Benchmark report (also stored; fetch again with GET /benchmark/{report_id})
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BenchmarkReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /projects/{project_id}/benchmark/{report_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: report_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getBenchmarkReport
      tags: [Verification]
      security: [{guestSession: []}]
      responses:
        '200':
          description: Stored benchmark report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BenchmarkReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/export:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: exportSource
      tags: [Planned M2+]
      description: Planned M3. Download current Java source.
      security: [{guestSession: []}]
      responses:
        '200':
          description: Java source download
          content:
            text/x-java-source:
              schema: {type: string}
components:
  securitySchemes:
    guestSession:
      type: apiKey
      in: cookie
      name: blueprints_session
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: No valid guest session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Project, current analysis, method, or node does not exist
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: Stale source revision or mismatched analysis artifact
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    TooLarge:
      description: Uploaded source exceeds configured size
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unavailable:
      description: Java analysis/transform worker or isolated runner is not configured or unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Timeout:
      description: Java analysis or transformation worker timeout
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unprocessable:
      description: Transformation target or worker result is invalid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: analyzer_unavailable}
        message: {type: string}
        details:
          type: object
          description: 'Structured context for some errors, e.g. {reasons: [...]} for move_rejected'
    Project:
      type: object
      required: [id, filename, kind, file_count, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        filename: {type: string, example: Main.java, description: Java file name (single_file) or archive name (archive)}
        kind: {type: string, enum: [single_file, archive], description: "Archive projects reject the single-file /source, /transform and /verify routes with 409 multi_file_project"}
        file_count: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    UpdateFileRequest:
      type: object
      required: [source, expected_revision]
      properties:
        source: {type: string}
        expected_revision: {type: integer, minimum: 1}
    FileEntry:
      type: object
      required: [path, kind, role, size, sha256]
      properties:
        path: {type: string, example: src/main/java/com/acme/Main.java}
        kind: {type: string, enum: [java, resource]}
        role: {type: string, enum: [main, test, resource]}
        source_root: {type: string, nullable: true, example: src/main/java/}
        size: {type: integer}
        sha256: {type: string}
    SkippedEntry:
      type: object
      required: [path, reason]
      properties:
        path: {type: string}
        reason: {type: string}
    Manifest:
      type: object
      required: [revision, files, skipped]
      properties:
        revision: {type: integer, minimum: 1}
        files:
          type: array
          items: {$ref: '#/components/schemas/FileEntry'}
        skipped:
          type: array
          items: {$ref: '#/components/schemas/SkippedEntry'}
    UpdateSourceRequest:
      type: object
      required: [source, expected_revision]
      properties:
        source: {type: string}
        expected_revision: {type: integer, minimum: 1}
    RevisionSummary:
      type: object
      required: [revision, has_analysis]
      properties:
        revision: {type: integer, minimum: 1}
        has_analysis: {type: boolean}
    RevisionDetail:
      type: object
      required: [revision, source, has_analysis]
      properties:
        revision: {type: integer, minimum: 1}
        source: {type: string}
        has_analysis: {type: boolean}
    SourceRange:
      type: object
      required: [start, length]
      properties:
        file: {type: string}
        start: {type: integer, minimum: 0, description: 'UTF-16 code-unit offset, matching JDT String indices'}
        length: {type: integer, minimum: 0, description: 'UTF-16 code-unit length'}
        line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
    Method:
      type: object
      required: [id, name, source_range]
      properties:
        id: {type: string}
        name: {type: string}
        source_range: {$ref: '#/components/schemas/SourceRange'}
    Diagnostic:
      type: object
      required: [code, severity, message, source_range]
      properties:
        code: {type: string}
        severity: {type: string, enum: [error, warning, info]}
        message: {type: string}
        source_range: {$ref: '#/components/schemas/SourceRange'}
    AnalysisResult:
      type: object
      required: [protocol_version, status, revision, methods, diagnostics]
      properties:
        protocol_version: {type: integer, enum: [1]}
        status: {type: string, enum: [completed, partial, failed]}
        revision: {type: integer, minimum: 1}
        methods:
          type: array
          items: {$ref: '#/components/schemas/Method'}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
    MethodsResponse:
      type: object
      required: [revision, methods]
      properties:
        revision: {type: integer, minimum: 1}
        methods:
          type: array
          items: {$ref: '#/components/schemas/CfgMethod'}
    ProjectGraphResponse:
      type: object
      required: [revision, graph]
      properties:
        revision: {type: integer, minimum: 1}
        graph:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/ProjectGraph'}
    ProjectGraph:
      type: object
      required: [version, scope, nodes, edges, unresolved_calls, stats]
      properties:
        version: {type: integer, enum: [1]}
        scope: {type: string, enum: [compilation_unit, project]}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/ProjectGraphNode'}
        edges:
          type: array
          items: {$ref: '#/components/schemas/ProjectGraphEdge'}
        unresolved_calls:
          type: array
          items: {$ref: '#/components/schemas/UnresolvedProjectCall'}
        stats: {$ref: '#/components/schemas/ProjectGraphStats'}
    ProjectGraphNode:
      type: object
      required: [id, kind, name, source_range]
      properties:
        id: {type: string}
        kind: {type: string, enum: [class, interface, enum, record, annotation_type, method, constructor]}
        name: {type: string}
        qualified_name: {type: string, nullable: true}
        method_id: {type: string, nullable: true}
        cfg_entry: {type: string, nullable: true}
        file: {type: string, nullable: true, description: Project-relative path; present for archive projects}
        source_range: {$ref: '#/components/schemas/SourceRange'}
        external_supertypes:
          type: array
          items:
            type: object
            required: [name, relation, resolved]
            properties:
              name: {type: string}
              relation: {type: string, enum: [extends, implements]}
              resolved: {type: boolean}
    ProjectGraphEdge:
      type: object
      required: [from, to, kind, count, sites]
      properties:
        from: {type: string}
        to: {type: string}
        kind: {type: string, enum: [contains, extends, implements, calls, constructs, depends_on]}
        count: {type: integer, minimum: 0}
        sites:
          type: array
          items: {$ref: '#/components/schemas/SourceRange'}
    UnresolvedProjectCall:
      type: object
      required: [id, from, kind, name, expression, source_range, reason]
      properties:
        id: {type: string}
        from: {type: string}
        kind: {type: string, enum: [method_call, constructor_call]}
        name: {type: string}
        expression: {type: string}
        source_range: {$ref: '#/components/schemas/SourceRange'}
        reason: {type: string}
    ProjectGraphStats:
      type: object
      required: [resolved_internal_calls, external_calls, unresolved_calls]
      properties:
        resolved_internal_calls: {type: integer, minimum: 0}
        external_calls: {type: integer, minimum: 0}
        unresolved_calls: {type: integer, minimum: 0}
    CfgMethod:
      type: object
      required: [selector, id, name, kind, source_range]
      properties:
        selector: {type: string, example: f2m1, description: 'Opaque and valid only for this analyzed revision (m<N> for single files, f<F>m<N> for archive projects). Use `id` as the stable cross-revision reference.'}
        id: {type: string, example: 'Example.process(int)'}
        name: {type: string, example: process}
        kind: {type: string, enum: [method, constructor]}
        source_range: {$ref: '#/components/schemas/SourceRange'}
    CfgNode:
      type: object
      required: [id, kind, source_range]
      properties:
        id: {type: string}
        kind: {type: string, example: branch}
        statement_kind: {type: string, example: if}
        text: {type: string, example: 'count > 0'}
        source_range: {$ref: '#/components/schemas/SourceRange'}
        reachable: {type: boolean, description: 'Omitted when true; false marks an unreachable node'}
    CfgEdge:
      type: object
      required: [from, to, kind]
      properties:
        from: {type: string}
        to: {type: string}
        kind: {type: string, example: 'true'}
        label: {type: string}
        back: {type: boolean, description: 'Present and true for a cycle-closing edge'}
    Cfg:
      type: object
      required: [method_id, entry, exit, nodes, edges]
      properties:
        method_id: {type: string}
        entry: {type: string, example: m1.n0}
        exit: {type: string, example: m1.n1}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/CfgNode'}
        edges:
          type: array
          items: {$ref: '#/components/schemas/CfgEdge'}
    ComplexityEstimate:
      type: object
      required: [time, confidence, reason, assumptions]
      properties:
        time: {type: string, example: 'O(n*m)'}
        confidence: {type: string, enum: [high, medium, low]}
        reason: {type: string}
        assumptions:
          type: array
          items: {type: string}
    ComplexityFragment:
      allOf:
        - {$ref: '#/components/schemas/ComplexityEstimate'}
        - type: object
          required: [kind, statement_kind, source_range, node_ids]
          properties:
            kind: {type: string, example: loop}
            statement_kind: {type: string, example: foreach}
            source_range: {$ref: '#/components/schemas/SourceRange'}
            node_ids:
              type: array
              items: {type: string, example: m1.n2}
    AnalysisFinding:
      type: object
      required: [id, severity, message, explanation, recommendation, source_range, node_ids]
      properties:
        id: {type: string, example: repeated_collection_scan}
        severity: {type: string, enum: [warning, info]}
        message: {type: string}
        explanation: {type: string}
        recommendation: {type: string}
        source_range: {$ref: '#/components/schemas/SourceRange'}
        node_ids:
          type: array
          items: {type: string, example: m1.n2}
    MethodComplexity:
      type: object
      required: [method_id, time_complexity, space_complexity, confidence, analysis_engine, reason, assumptions, limitations, source_range, cfg_node_ids]
      properties:
        method_id: {type: string, example: 'com.acme.service.Repo.find(int)', description: 'Stable reference: package.Type.method(ParamTypes)'}
        file: {type: string, nullable: true}
        time_complexity: {type: string, example: 'O(n)', description: 'O(...) or the literal unknown'}
        space_complexity: {type: string, nullable: true, description: 'Always null: not estimated'}
        confidence: {type: string, enum: [high, medium, low]}
        analysis_engine: {type: string, example: jdt-static-cost-model/2}
        reason: {type: string}
        assumptions: {type: array, items: {type: string}}
        limitations: {type: array, items: {type: string}}
        source_range: {$ref: '#/components/schemas/SourceRange'}
        cfg_node_ids: {type: array, items: {type: string}}
    ComplexityReport:
      type: object
      required: [revision, methods]
      properties:
        revision: {type: integer, minimum: 1}
        methods:
          type: array
          items: {$ref: '#/components/schemas/MethodComplexity'}
    MethodFinding:
      type: object
      required: [method_id, finding]
      properties:
        method_id: {type: string}
        file: {type: string, nullable: true}
        finding: {$ref: '#/components/schemas/AnalysisFinding'}
    FindingsReport:
      type: object
      required: [revision, findings]
      properties:
        revision: {type: integer, minimum: 1}
        findings:
          type: array
          items: {$ref: '#/components/schemas/MethodFinding'}
    OptimizationList:
      type: object
      required: [revision, rule, proposals]
      properties:
        revision: {type: integer, minimum: 1}
        rule: {type: string, example: nested_scan_to_hashmap}
        proposals:
          type: array
          items: {$ref: '#/components/schemas/OptimizationProposal'}
    OptimizationProposal:
      type: object
      required: [id, rule, applicability, preconditions, assumptions, method_id, file, affected_files, complexity]
      properties:
        id: {type: string, example: opt_b02408650a81707d, description: Valid for the revision it was detected in}
        rule: {type: string}
        title: {type: string}
        summary: {type: string}
        applicability: {type: string, enum: [applicable, not_applicable]}
        not_applicable_reasons: {type: array, items: {type: string}}
        method_id: {type: string, nullable: true}
        file: {type: string}
        affected_files: {type: array, items: {type: string}}
        shape: {type: string, enum: [first_match, all_matches]}
        outer_loop: {$ref: '#/components/schemas/SourceRange'}
        inner_loop: {$ref: '#/components/schemas/SourceRange'}
        key:
          type: object
          properties:
            element_expression: {type: string, example: 'contact.id()'}
            lookup_expression: {type: string, example: 'task.getContactId()'}
            type: {type: string, example: int}
            equality: {type: string, example: '=='}
        preconditions:
          type: array
          items:
            type: object
            required: [id, status, detail]
            properties:
              id: {type: string, enum: [lookup_shape, key_equality, key_purity, control_flow, collection_reference, collection_not_modified, insertion_point]}
              status: {type: string, enum: [satisfied, violated]}
              detail: {type: string}
        assumptions:
          type: array
          description: Empty for not-applicable proposals. Every id must be acknowledged on apply.
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string, enum: [null_and_exception_timing, single_threaded]}
              text: {type: string}
        complexity:
          type: object
          properties:
            method_before: {type: string, description: Static estimate of the whole method now (may be unknown)}
            scan_before: {type: string, example: 'O(n*m)'}
            scan_after: {type: string, example: 'O(n + m)'}
            note: {type: string}
    FileDiff:
      type: object
      required: [path, status, additions, deletions, unified_diff]
      properties:
        path: {type: string}
        status: {type: string, enum: [added, removed, modified]}
        additions: {type: integer}
        deletions: {type: integer}
        unified_diff: {type: string, description: 'Standard unified diff with 3 lines of context'}
    OptimizationPreviewRequest:
      type: object
      required: [base_revision]
      properties:
        base_revision: {type: integer, minimum: 1}
        source_level: {type: string, enum: ['8', '11', '17', '21']}
    OptimizationPreview:
      type: object
      required: [base_revision, proposal, diff, preview_sha256, method_complexity_before, method_complexity_after, validation]
      properties:
        base_revision: {type: integer}
        proposal: {$ref: '#/components/schemas/OptimizationProposal'}
        diff: {type: array, items: {$ref: '#/components/schemas/FileDiff'}}
        preview_sha256: {type: string}
        method_complexity_before: {type: string, nullable: true}
        method_complexity_after: {type: string, nullable: true}
        validation: {type: string, enum: [valid]}
    OptimizationApplyRequest:
      type: object
      required: [base_revision, preview_sha256, acknowledged_assumptions]
      properties:
        base_revision: {type: integer, minimum: 1}
        source_level: {type: string, enum: ['8', '11', '17', '21']}
        preview_sha256: {type: string}
        acknowledged_assumptions: {type: array, items: {type: string}}
    OptimizationApplyResponse:
      type: object
      required: [revision, base_revision, proposal, diff, analysis_status]
      properties:
        revision: {type: integer, minimum: 2}
        base_revision: {type: integer}
        proposal: {$ref: '#/components/schemas/OptimizationProposal'}
        diff: {type: array, items: {$ref: '#/components/schemas/FileDiff'}}
        method_complexity_before: {type: string, nullable: true}
        method_complexity_after: {type: string, nullable: true}
        analysis_status: {type: string, enum: [completed, partial]}
    RollbackRequest:
      type: object
      required: [base_revision, to_revision]
      properties:
        base_revision: {type: integer, minimum: 1, description: The current revision}
        to_revision: {type: integer, minimum: 1, description: An earlier revision to restore}
    RevisionDiff:
      type: object
      required: [from_revision, to_revision, files]
      properties:
        from_revision: {type: integer}
        to_revision: {type: integer}
        files: {type: array, items: {$ref: '#/components/schemas/FileDiff'}}
    CfgEditRequest:
      type: object
      required: [base_revision, method_id, operation]
      properties:
        base_revision: {type: integer, minimum: 1}
        source_level: {type: string, enum: ['8', '11', '17', '21']}
        method_id: {type: string, example: 'com.acme.Calc.run(int,int)'}
        operation: {$ref: '#/components/schemas/CfgEditOperation'}
    CfgEditOperation:
      type: object
      required: [type, node_id, target_node_id, position]
      properties:
        type: {type: string, enum: [move_statement]}
        node_id: {type: string, example: 'f1m0.n3', description: 'CFG node of the statement to move (a statement node, or the condition node of an if/loop to move the whole compound statement)'}
        target_node_id: {type: string, example: 'f1m0.n2'}
        position: {type: string, enum: [before, after]}
    CfgEditApplyRequest:
      allOf:
        - {$ref: '#/components/schemas/CfgEditRequest'}
        - type: object
          required: [preview_sha256]
          properties:
            preview_sha256: {type: string}
    CfgEditPreview:
      type: object
      required: [base_revision, method_id, operation, diff, preview_sha256, node_mapping]
      properties:
        base_revision: {type: integer}
        method_id: {type: string}
        operation:
          type: object
          description: What moves, where, and for every statement it jumps over whether it is independent (with the read/write sets used)
        diff: {type: array, items: {$ref: '#/components/schemas/FileDiff'}}
        preview_sha256: {type: string}
        node_mapping:
          type: array
          items:
            type: object
            required: [old_id, new_id]
            properties:
              old_id: {type: string}
              new_id: {type: string, nullable: true}
    CfgEditApplyResponse:
      type: object
      required: [revision, base_revision, method_id, operation, diff, node_mapping, analysis_status]
      properties:
        revision: {type: integer, minimum: 2}
        base_revision: {type: integer}
        method_id: {type: string}
        operation: {type: object}
        diff: {type: array, items: {$ref: '#/components/schemas/FileDiff'}}
        node_mapping: {type: array, items: {type: object}}
        analysis_status: {type: string, enum: [completed, partial]}
    BenchmarkRequest:
      type: object
      additionalProperties: false
      required: [baseline_revision, candidate_revision, workloads]
      properties:
        baseline_revision: {type: integer, minimum: 1}
        candidate_revision: {type: integer, minimum: 1}
        workloads:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [name, stdin]
            properties:
              name: {type: string, minLength: 1, maxLength: 64}
              size: {type: integer, minimum: 0, description: 'The input size you used to build stdin (reported back)'}
              stdin: {type: string, description: 'Deterministic stdin, at most 65536 bytes'}
        warmup_iterations: {type: integer, minimum: 0, maximum: 50, default: 5}
        measured_iterations: {type: integer, minimum: 1, maximum: 100, default: 15}
        class_loading: {type: string, enum: [fresh, shared], default: fresh}
        iteration_timeout_ms: {type: integer, minimum: 1, maximum: 60000, default: 10000}
        main_class: {type: string, nullable: true, description: 'Archive projects: class with main(String[])'}
        source_level: {type: string, enum: ['8', '11', '17', '21'], default: '21'}
    BenchmarkReport:
      type: object
      required: [report_id, created_at, status, baseline_revision, candidate_revision, settings, environment, timings, static_complexity, functional, runtime, limitations]
      properties:
        report_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        status: {type: string, enum: [completed, compilation_failed, incomplete]}
        baseline_revision: {type: integer}
        candidate_revision: {type: integer}
        settings: {type: object}
        environment: {type: object, description: 'Runner image, CPU/memory limits, network, and the JVM facts reported inside the container'}
        timings:
          type: object
          description: 'Per revision: compile_and_setup_ms, harness_setup_ms, benchmark_process_ms - none of these is algorithm time'
        static_complexity:
          type: object
          description: '1. Static Big O before/after: changes[] {method_id, before, after, confidence_before, confidence_after}'
        functional:
          type: object
          description: '2. Functional outcome: equivalent_on_all_workloads, non_equivalent_workloads[]'
        runtime:
          type: object
          description: '3. Measured runtime: workloads[] {samples, median/min/max/quartiles/MAD/stddev, verdict, speedup, speedup_ci95, p_value, notes} and overall {verdict, summary}'
        baseline_compilation: {type: object}
        candidate_compilation: {type: object}
        limitations: {type: array, items: {type: string}}
    MethodAnalysis:
      type: object
      required: [complexity, fragments, findings]
      properties:
        complexity: {$ref: '#/components/schemas/ComplexityEstimate'}
        fragments:
          type: array
          items: {$ref: '#/components/schemas/ComplexityFragment'}
        findings:
          type: array
          items: {$ref: '#/components/schemas/AnalysisFinding'}
    MethodAnalysisResponse:
      type: object
      required: [revision, method_id, analysis]
      properties:
        revision: {type: integer, minimum: 1}
        method_id: {type: string, example: 'Example.process(int)'}
        analysis: {$ref: '#/components/schemas/MethodAnalysis'}
    TransformRequest:
      type: object
      required: [base_revision, method_id, node_id, operation]
      properties:
        base_revision: {type: integer, minimum: 1}
        method_id: {type: string, example: 'Example.process(int)'}
        node_id: {type: string, example: m1.n2}
        operation:
          type: object
          required: [type, expression]
          properties:
            type: {type: string, enum: [replace_condition]}
            expression: {type: string, example: 'count >= 0'}
    TransformResponse:
      type: object
      required: [revision, source]
      properties:
        revision: {type: integer, minimum: 2}
        source: {type: string}
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [baseline_revision, candidate_revision, test_cases]
      properties:
        main_class: {type: string, nullable: true, description: 'Archive projects: fully qualified class with main(String[]). Optional when exactly one analysed class has a main method (400 main_class_required otherwise)'}
        source_level: {type: string, enum: ['8', '11', '17', '21'], description: 'Archive projects: javac --release'}
        baseline_revision: {type: integer, minimum: 1}
        candidate_revision: {type: integer, minimum: 1}
        test_cases:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/VerifyTestCase'
    VerifyTestCase:
      type: object
      additionalProperties: false
      required: [name, stdin]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        stdin: {type: string, description: 'UTF-8 stdin, at most 65536 bytes'}
    VerificationReport:
      type: object
      required: [status, baseline_revision, candidate_revision, baseline_compilation, candidate_compilation, executed_test_cases, test_cases, explanation]
      properties:
        status: {type: string, enum: [passed, failed, compilation_failed]}
        baseline_revision: {type: integer, minimum: 1}
        candidate_revision: {type: integer, minimum: 1}
        baseline_compilation: {$ref: '#/components/schemas/CompilationResult'}
        candidate_compilation: {$ref: '#/components/schemas/CompilationResult'}
        executed_test_cases: {type: integer, minimum: 0}
        test_cases:
          type: array
          items: {$ref: '#/components/schemas/TestCaseResult'}
        explanation: {type: string}
    PersistedVerificationReport:
      allOf:
        - {$ref: '#/components/schemas/VerificationReport'}
        - type: object
          required: [report_id, created_at, requested_test_cases, behaviorally_verified]
          properties:
            report_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            requested_test_cases: {type: integer, minimum: 1}
            behaviorally_verified:
              type: boolean
              description: True only for a complete passed run of every supplied non-empty fixture.
    CompilationResult:
      type: object
      required: [status, exit_code, timed_out, output_overflow, stdout, stderr, main_class, diagnostics]
      properties:
        status: {type: string, enum: [completed, failed, timed_out, output_overflow, missing_main]}
        exit_code: {type: integer, nullable: true}
        timed_out: {type: boolean}
        output_overflow: {type: boolean}
        stdout: {$ref: '#/components/schemas/CapturedStream'}
        stderr: {$ref: '#/components/schemas/CapturedStream'}
        main_class: {type: string, nullable: true}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/RunnerDiagnostic'}
    RunnerDiagnostic:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    CapturedStream:
      type: object
      required: [utf8, base64, truncated]
      properties:
        utf8: {type: string, nullable: true}
        base64: {type: string, format: byte}
        truncated: {type: boolean}
    TestCaseResult:
      type: object
      required: [name, passed, mismatches, baseline, candidate]
      properties:
        name: {type: string}
        passed: {type: boolean}
        mismatches:
          type: array
          items: {$ref: '#/components/schemas/BehaviorMismatch'}
        baseline: {$ref: '#/components/schemas/ExecutionObservation'}
        candidate: {$ref: '#/components/schemas/ExecutionObservation'}
    ExecutionObservation:
      type: object
      required: [stdout, stderr, exit_code, timed_out, output_overflow]
      properties:
        stdout: {$ref: '#/components/schemas/CapturedStream'}
        stderr: {$ref: '#/components/schemas/CapturedStream'}
        exit_code: {type: integer, nullable: true}
        timed_out: {type: boolean}
        output_overflow: {type: boolean}
    BehaviorMismatch:
      type: object
      required: [field, explanation]
      properties:
        field: {type: string, enum: [stdout, stderr, exit_code, timed_out, output_overflow]}
        explanation: {type: string}
